<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduSmart AI - Education ERP</title>
    <style>
        :root {
            --primary: #4361ee;
            --secondary: #3f37c9;
            --accent: #4895ef;
            --dark: #2b2d42;
            --light: #f8f9fa;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: var(--light);
            color: var(--dark);
        }

        .dashboard {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
            min-height: 100vh;
        }

        /* Main Content */
        .main-content {
            background: #f0f2f5;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: white;
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .ai-section {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 2rem;
            margin-top: 2rem;
        }

        .ai-predictive {
            background: white;
            padding: 1.5rem;
            border-radius: 12px;
        }

        .ai-assistant {
            background: var(--primary);
            color: white;
            padding: 1.5rem;
            border-radius: 12px;
        }

        /* Interactive Elements */
        .btn {
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .chart-container {
            height: 300px;
            margin: 1rem 0;
        }

        @media (max-width: 768px) {
            .ai-section {
                grid-template-columns: 1fr;
            }
            
            .dashboard {
                padding: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <!-- Main Content -->
        <div class="main-content">
            <div class="header">
                <h1>AI Education Dashboard</h1>
                <div class="header-actions">
                    <button class="btn btn-primary">New Student</button>
                    <button class="btn btn-primary">Generate Report</button>
                </div>
            </div>

            <!-- Stats Grid -->
            <div class="stats-grid">
                <div class="stat-card">
                    <h3>Total Students</h3>
                    <p>2,450</p>
                    <div class="chart-container" id="studentChart"></div>
                </div>
                <div class="stat-card">
                    <h3>Active Courses</h3>
                    <p>45</p>
                    <div class="chart-container" id="courseChart"></div>
                </div>
                <div class="stat-card">
                    <h3>Attendance Rate</h3>
                    <p>92%</p>
                    <div class="chart-container" id="attendanceChart"></div>
                </div>
            </div>

            <!-- AI Section -->
            <div class="ai-section">
                <div class="ai-predictive">
                    <h2>Predictive Analytics</h2>
                    <div class="chart-container" id="predictiveChart"></div>
                    <button class="btn btn-primary">Generate Insights</button>
                </div>
                <div class="ai-assistant">
                    <h2>AI Assistant</h2>
                    <div class="chat-container">
                        <div class="chat-message">How can I help you today?</div>
                        <input type="text" placeholder="Ask me anything...">
                        <button class="btn btn-primary">Send</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Sample interactive functionality
        // Chart initialization (would be replaced with actual chart library)
        function initCharts() {
            const charts = document.querySelectorAll('.chart-container');
            charts.forEach(chart => {
                chart.innerHTML = `<svg style="width:100%; height:100%">
                    <!-- Sample chart visualization -->
                    <rect width="100%" height="100%" fill="#eee"/>
                </svg>`;
            });
        }

        initCharts();
    </script>
</body>
</html>
